name: Continuous Integration

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  environment:
    name: Environment setup and caching
    runs-on: ubuntu-latest
    steps:
      - name: Checkout_Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Caching Files
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  quality:
    runs-on: ubuntu-latest
    needs: [environment]
    steps:
      - name: Linting
        run: bun run lint

      - name: Check types
        run: bun run check-types

      - name: Formatting
        run: bun run format

      - name: Remove dead imports
        run: bun run knip --no-exit-code

  security:
    runs-on: ubuntu-latest
    needs: [environment]
    steps:
      - name: Auditing packages
        run: bun audit

      - name: Secret Scan
        uses: advanced-security/secret-scanning-review-action@v1
        env:
          SECRET_TOKEN: ${{secrets.SECRET_TOKEN}}

  build:
    runs-on: ubuntu-latest
    needs:
      - quality
      - security
    steps:
      - name: Project Build
        run: bun run build
