name: Continuous Integration

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Linting
        run: bun run lint

      - name: Check types
        run: bun run check-types

      - name: Formatting
        run: bun run format

      - name: Remove dead imports
        run: bun run knip --no-exit-code

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Auditing packages
        run: bun audit

      - name: Secret Scan
        uses: advanced-security/secret-scanning-review-action@v1
        with:
          token: ${{vars.GITHUB_TOKEN}}
        if: github.event_name == 'pull_request'

  build:
    runs-on: ubuntu-latest
    needs:
      - quality
      - security
    env:
      BETTER_AUTH_SECRET: ${{ vars.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ vars.GOOGLE_GENERATIVE_AI_API_KEY }}
      RESEND_API_KEY: ${{ vars.RESEND_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ vars.GOOGLE_CLIENT_SECRET }}
      GITHUB_CLIENT_ID: ${{ vars.CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ vars.CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Installing Dependencies
        run: bun install

      - name: Project Build
        run: bun run build
